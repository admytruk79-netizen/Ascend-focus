name: ASCEND Focus backend smoke
on:
  push:
    paths:
      - 'server/**'
      - 'src/adminConfig.ts'
      - '.github/workflows/backend-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node server/smoke.mjs
