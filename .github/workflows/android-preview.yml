name: ASCEND Focus Android install preview
on:
  push:
    paths:
      - 'src/**'
      - 'server/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'capacitor.config.ts'
      - 'android/**'
      - '.github/workflows/android-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Use preinstalled Android SDK and install required components
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          "$SDKMANAGER" --list_installed | grep -E "platforms;android-35|build-tools;35.0.0"
      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate web application
        run: |
          npm run typecheck
          npm test
          npm run api:test
          npm run build
      - name: Sync web assets into the committed Android project
        run: npx cap sync android
      - name: Build non-debuggable preview APK
        working-directory: android
        run: bash ./gradlew assemblePreview --no-daemon -Pandroid.injected.testOnly=false
      - name: Verify installable preview APK and write SHA-256
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/preview/app-preview.apk
          test -s "$APK"
          file "$APK"
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/35.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > android/app/build/outputs/apk/preview/APK-METADATA.txt
          grep -F "package: name='com.hiddenlaws.ascendfocus.debug'" android/app/build/outputs/apk/preview/APK-METADATA.txt
          grep -F "sdkVersion:'23'" android/app/build/outputs/apk/preview/APK-METADATA.txt
          grep -F "targetSdkVersion:'35'" android/app/build/outputs/apk/preview/APK-METADATA.txt
          "$BUILD_TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml > android/app/build/outputs/apk/preview/APK-MANIFEST.txt
          python3 - <<'PY'
          import pathlib,zipfile
          path=pathlib.Path('android/app/build/outputs/apk/preview')
          metadata=(path/'APK-METADATA.txt').read_text()
          manifest=(path/'APK-MANIFEST.txt').read_text()
          assert 'application-debuggable' not in metadata, 'APK must not be debuggable'
          for line in manifest.splitlines():
              if 'android:testOnly' in line or 'android:debuggable' in line:
                  assert '0xffffffff' not in line, line
          with zipfile.ZipFile(path/'app-preview.apk') as apk:
              native=[n for n in apk.namelist() if n.startswith('lib/') and n.endswith('.so')]
              assert not native or any(n.startswith('lib/arm64-v8a/') for n in native), 'Missing ARM64 support'
          print('Verified: non-debuggable, not test-only, ARM64-compatible package.')
          PY
          sha256sum "$APK" | tee android/app/build/outputs/apk/preview/SHA256SUMS.txt
          ls -lh "$APK"
      - name: Enable hardware acceleration for the test phone
        run: |
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Test normal APK installation and launch on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 180
          script: |
            adb install android/app/build/outputs/apk/preview/app-preview.apk
            adb shell am start -W -n com.hiddenlaws.ascendfocus.debug/com.hiddenlaws.ascendfocus.MainActivity
            adb shell pidof com.hiddenlaws.ascendfocus.debug
      - name: Prepare clearly named download
        run: |
          mkdir -p install
          cp android/app/build/outputs/apk/preview/app-preview.apk install/ASCEND-Focus.apk
          sha256sum install/ASCEND-Focus.apk > install/SHA256SUMS.txt
      - name: Publish direct install APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: focus-preview-${{ github.run_number }}
          name: ASCEND Focus Android Preview ${{ github.run_number }}
          prerelease: true
          body: |
            Direct Android APK download. Non-debuggable preview; no Developer Mode required.
            Requires Android 6.0 or later.
            Installs as ASCEND Focus (Preview).
            Signature, alignment, package metadata and Android 35 emulator installation checked in CI.
          files: |
            install/ASCEND-Focus.apk
            install/SHA256SUMS.txt
            android/app/build/outputs/apk/preview/APK-METADATA.txt
            android/app/build/outputs/apk/preview/APK-MANIFEST.txt
      - name: Publish debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ascend-focus-android-debug
          path: |
            android/app/build/outputs/apk/preview/app-preview.apk
            android/app/build/outputs/apk/preview/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
